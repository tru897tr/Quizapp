<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lam bai - Quiz Master</title>
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/quiz.css">
</head>
<body class="quiz-page-body">

<div class="quiz-topbar">
    <div class="container quiz-topbar-inner">
        <a href="/" class="icon-btn" aria-label="Thoat" data-icon="arrow-left"></a>
        <span class="quiz-topbar-title" id="quizTitleLabel">Dang tai...</span>
        <span class="quiz-timer"><span data-icon="clock"></span><span id="timerLabel">00:00</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<div class="quiz-main">
    <div id="loadingState" class="loading-row"><span class="spinner"></span> Dang tai cau hoi...</div>

    <div id="errorState" class="empty-state" style="display:none">
        <div class="icon-xl" data-icon="alert-triangle"></div>
        <h3 class="empty-title" id="errorTitle">Khong the tai quiz</h3>
        <p class="empty-subtitle" id="errorMessage"></p>
        <a href="/" class="btn btn-primary">Ve trang chu</a>
    </div>

    <div id="quizContainer" style="display:none">
        <p class="quiz-progress-label" id="progressLabel"></p>
        <div class="question-panel">
            <h2 class="question-text" id="questionText"></h2>
            <div class="options-grid" id="optionsGrid"></div>
        </div>
        <div class="quiz-nav-row">
            <button class="btn btn-primary" id="nextBtn" style="display:none">Cau tiep theo <span data-icon="arrow-right" data-icon-class="icon-sm"></span></button>
            <button class="btn btn-primary" id="finishBtn" style="display:none">Xem ket qua <span data-icon="check" data-icon-class="icon-sm"></span></button>
        </div>
        <p class="anti-cheat-note"><span data-icon="shield-check" data-icon-class="icon-sm"></span> Thoi gian va dap an duoc may chu xac thuc, dam bao cong bang cho moi nguoi choi.</p>
    </div>

    <div id="resultContainer" style="display:none">
        <div class="result-panel">
            <div class="result-badge" data-icon="trophy"></div>
            <h2 class="result-title">Hoan thanh!</h2>
            <p class="result-subtitle" id="resultQuizTitle"></p>
            <div class="result-stats">
                <div class="result-stat"><div class="result-stat-value" id="statTotal">--</div><div class="result-stat-label">Tong thoi gian</div></div>
                <div class="result-stat"><div class="result-stat-value" id="statAvg">--</div><div class="result-stat-label">Trung binh/cau</div></div>
                <div class="result-stat"><div class="result-stat-value" id="statFastest">--</div><div class="result-stat-label">Nhanh nhat</div></div>
                <div class="result-stat"><div class="result-stat-value" id="statSlowest">--</div><div class="result-stat-label">Cham nhat</div></div>
            </div>
            <div class="result-actions">
                <button class="btn btn-outline" id="retryBtn"><span data-icon="refresh" data-icon-class="icon-sm"></span> Lam lai</button>
                <a class="btn btn-secondary" id="leaderboardLink" href="#"><span data-icon="trophy" data-icon-class="icon-sm"></span> Bang xep hang</a>
                <a class="btn btn-primary" href="/myactivities"><span data-icon="book" data-icon-class="icon-sm"></span> Danh sach cua toi</a>
            </div>
        </div>
    </div>
</div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/toast.js"></script>
<script src="/assets/js/quiz-play.js"></script>
</body>
</html>
