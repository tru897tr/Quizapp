<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dang nhap - Quiz Master</title>
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page-body">
<div class="auth-wrap">
<div class="auth-card">
    <div class="auth-header">
        <a href="/" class="logo-mark" style="display:flex;text-decoration:none" data-icon="target"></a>
        <h1>Chao mung tro lai</h1>
        <p>Dang nhap de tiep tuc voi Quiz Master</p>
    </div>

    <div class="tabs">
        <button class="tab active" type="button" data-tab="login">Dang nhap</button>
        <button class="tab" type="button" data-tab="register">Dang ky</button>
    </div>
    <br>
    <div id="message" class="message"></div>

    <form id="loginForm" class="auth-form active">
        <div class="form-group">
            <label class="form-label" for="loginUsername">Ten dang nhap</label>
            <input type="text" id="loginUsername" class="form-input" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="loginPassword">Mat khau</label>
            <div class="input-with-icon">
                <input type="password" id="loginPassword" class="form-input" name="password" autocomplete="current-password" required>
                <button type="button" class="input-icon-btn toggle-password" data-target="loginPassword" data-icon="eye" aria-label="Hien mat khau"></button>
            </div>
        </div>
        <div class="form-footer">
            <button type="button" class="link-button" id="forgotPasswordBtn">Quen mat khau?</button>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Dang nhap</button>
    </form>

    <form id="registerForm" class="auth-form">
        <div class="form-group">
            <label class="form-label" for="regFullname">Ho va ten</label>
            <input type="text" id="regFullname" class="form-input" name="fullname" maxlength="100" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="regEmail">Email</label>
            <input type="email" id="regEmail" class="form-input" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="regUsername">Ten dang nhap</label>
            <input type="text" id="regUsername" class="form-input" name="username" pattern="[a-zA-Z0-9_]{3,20}" minlength="3" maxlength="20" autocomplete="username" required>
            <div class="form-hint">3-20 ky tu: chu khong dau, so va dau gach duoi (_).</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="regPassword">Mat khau</label>
            <div class="input-with-icon">
                <input type="password" id="regPassword" class="form-input" name="password" minlength="6" autocomplete="new-password" required>
                <button type="button" class="input-icon-btn toggle-password" data-target="regPassword" data-icon="eye" aria-label="Hien mat khau"></button>
            </div>
            <div class="form-hint">It nhat 6 ky tu.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Dang ky</button>
    </form>

    <div class="auth-footer">
        <a href="/" class="link-button"><span data-icon="arrow-left" data-icon-class="icon-sm" style="display:inline-flex;vertical-align:middle"></span> Ve trang chu</a>
    </div>
</div>
</div>

<div id="forgotPasswordModal" class="modal-overlay">
    <div class="modal">
        <div class="modal-header"><h2 class="modal-title">Quen mat khau</h2></div>
        <div class="modal-body">
            <p style="color:var(--gray-500);margin:0 0 18px;font-size:14px">Nhap email da dang ky. Neu email ton tai, lien ket dat lai mat khau se duoc gui toi va co hieu luc trong 5 phut.</p>
            <div class="form-group">
                <label class="form-label" for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" class="form-input" required>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="forgotCancelBtn" type="button">Huy</button>
            <button class="btn btn-primary" id="forgotSubmitBtn" type="button">Gui lien ket</button>
        </div>
    </div>
</div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/toast.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
