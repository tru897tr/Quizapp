<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dat lai mat khau - Quiz Master</title>
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body class="auth-page-body">
<div class="auth-wrap">
<div class="auth-card">
    <div class="auth-header">
        <span class="logo-mark" style="display:flex;margin:0 auto 16px" data-icon="key"></span>
        <h1>Dat lai mat khau</h1>
        <p>Nhap mat khau moi cho tai khoan cua ban</p>
    </div>

    <div id="message" class="message"></div>

    <form id="resetForm">
        <div class="form-group">
            <label class="form-label" for="newPassword">Mat khau moi</label>
            <div class="input-with-icon">
                <input type="password" id="newPassword" class="form-input" minlength="6" autocomplete="new-password" required>
                <button type="button" class="input-icon-btn toggle-password" data-target="newPassword" data-icon="eye" aria-label="Hien mat khau"></button>
            </div>
            <div class="form-hint">It nhat 6 ky tu.</div>
        </div>
        <div class="form-group">
            <label class="form-label" for="confirmPassword">Nhap lai mat khau moi</label>
            <input type="password" id="confirmPassword" class="form-input" minlength="6" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="resetSubmitBtn">Dat lai mat khau</button>
    </form>

    <div class="auth-footer">
        <a href="/login" class="link-button">Quay lai dang nhap</a>
    </div>
</div>
</div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/toast.js"></script>
<script src="/assets/js/reset-password.js"></script>
</body>
</html>
